# Bloco de configuração do servidor Nginx.
server {
    # Escuta requisições HTTP na porta 80.
    listen 80;

    # Rota raiz: atende o site/frontend.
    location / {
        # Encaminha para o serviço frontend na rede Docker, porta 3000.
        proxy_pass http://frontend:3000;
        # Usa HTTP/1.1 para suportar keep-alive e upgrade.
        proxy_http_version 1.1;
        # Repassa cabeçalho Upgrade para websocket/HMR do Vite.
        proxy_set_header Upgrade $http_upgrade;
        # Repassa Connection para permitir upgrade de protocolo.
        proxy_set_header Connection "upgrade";
        # Preserva o host original da requisição.
        proxy_set_header Host $host;
    }

    # Rotas que começam com /api/ são encaminhadas ao backend.
    location /api/ {
        # Encaminha para o serviço backend na rede Docker, porta 3333.
        proxy_pass http://backend:3333;
        # Usa HTTP/1.1 na comunicação com backend.
        proxy_http_version 1.1;
        # Preserva o host original.
        proxy_set_header Host $host;
        # Envia IP real do cliente ao backend.
        proxy_set_header X-Real-IP $remote_addr;
        # Encadeia IPs de proxies para auditoria/rate limit.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Informa protocolo original (http/https).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# RESUMO DO ARQUIVO
# -----------------------------------------------------------------------------
# Configura proxy reverso: serve frontend em / e encaminha /api/ ao backend, preservando headers.
